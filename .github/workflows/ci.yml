name: Public CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  scope:
    name: Select public proof scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.route.outputs.run }}
    steps:
      - name: Checkout public routing tools only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/public-ci/
            /tests/PostgreSql/Public/
      - name: Avoid duplicate automatic proof in mixed repository
        id: route
        env:
          CI_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: ./scripts/public-ci/Invoke-PublicCi.ps1 -Mode Route

  public:
    name: Public offline / ${{ matrix.platform }}
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
