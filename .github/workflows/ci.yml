        run: ./scripts/public-ci/Invoke-PublicCi.ps1 -Mode PostgreSql -ExpectedCommit $env:GITHUB_SHA -PublicRepository $env:PUBLIC_REPOSITORY -ProofDirectory (Join-Path $env:RUNNER_TEMP 'public-proof')
