            /tests/LogicGate.SiteFactory.Application.Tests/CoreModuleBoundaryTests.cs
            /tests/LogicGate.SiteFactory.Application.Tests/Generation/ClientFileStrategyTests.cs
            /tests/LogicGate.SiteFactory.Application.Tests/Generation/FileGenerationStrategyGuardTests.cs
