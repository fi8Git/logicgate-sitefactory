            /tests/LogicGate.SiteFactory.Runtime.Tests/
      - name: Verify exact public checkout
        run: ./scripts/public-ci/Invoke-PublicCi.ps1 -Mode Checkout
      - name: Install declared SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: false
      - name: Prove eleven public offline suites
        env:
          PUBLIC_REPOSITORY: ${{ github.event.repository.private == false && github.repository || '' }}
        run: ./scripts/public-ci/Invoke-PublicCi.ps1 -Mode Offline -ExpectedCommit $env:GITHUB_SHA -PublicRepository $env:PUBLIC_REPOSITORY -ProofDirectory (Join-Path $env:RUNNER_TEMP 'public-proof')
      - name: Retain controlled proof including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-ci-${{ matrix.platform }}
          path: ${{ runner.temp }}/public-proof/
          if-no-files-found: error
          retention-days: 7

