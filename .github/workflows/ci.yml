  proof:
    name: Require complete public proof
    needs: [scope, public, postgresql]
    if: always() && needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public verification tools only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/public-ci/
            /tests/PostgreSql/Public/
      - name: Download this run's controlled proofs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: public-ci-*
          path: ${{ runner.temp }}/public-proofs/
          merge-multiple: false
      - name: Verify every job, case, TRX, shard and cleanup
        env:
          CI_NEEDS: ${{ toJson(needs) }}
        run: ./scripts/public-ci/Invoke-PublicCi.ps1 -Mode Aggregate -ExpectedCommit $env:GITHUB_SHA -NeedsJson $env:CI_NEEDS -ProofDirectory (Join-Path $env:RUNNER_TEMP 'public-proofs')
