name: Public CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  public:
    name: Public offline / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-latest
            platform: Linux
    steps:
      - name: Checkout public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install declared SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: false
      - name: Prove eleven public offline suites
        env:
          PUBLIC_REPOSITORY: ${{ github.repository }}
        run: ./scripts/public-ci/Invoke-PublicCi.ps1 -Mode Offline -ExpectedCommit $env:GITHUB_SHA -PublicRepository $env:PUBLIC_REPOSITORY -ProofDirectory (Join-Path $env:RUNNER_TEMP 'public-proof')
      - name: Retain controlled proof including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-ci-${{ matrix.platform }}
          path: ${{ runner.temp }}/public-proof/
          if-no-files-found: error
          retention-days: 7

  postgresql:
    name: Public PostgreSQL REQUIRED / Linux
    runs-on: ubuntu-latest
    # Five sequential 360s shards plus auxiliary/build/cleanup budgets; not 360s globally.
    timeout-minutes: 120
    steps:
      - name: Checkout public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install declared SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: false
      - name: P04 real PostgreSQL five-shard proof
        env:
          PUBLIC_REPOSITORY: ${{ github.repository }}
        run: ./scripts/public-ci/Invoke-PublicCi.ps1 -Mode PostgreSql -ExpectedCommit $env:GITHUB_SHA -PublicRepository $env:PUBLIC_REPOSITORY -ProofDirectory (Join-Path $env:RUNNER_TEMP 'public-proof')
      - name: Retain controlled PostgreSQL proof including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-ci-PostgreSql
          path: ${{ runner.temp }}/public-proof/
          if-no-files-found: error
          retention-days: 7

  proof:
    name: Require complete public proof
    needs: [public, postgresql]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Download this run's controlled proofs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: public-ci-*
          path: ${{ runner.temp }}/public-proofs/
          merge-multiple: false
      - name: Verify every job, case, TRX, shard and cleanup
        env:
          CI_NEEDS: ${{ toJson(needs) }}
        run: ./scripts/public-ci/Invoke-PublicCi.ps1 -Mode Aggregate -ExpectedCommit $env:GITHUB_SHA -NeedsJson $env:CI_NEEDS -ProofDirectory (Join-Path $env:RUNNER_TEMP 'public-proofs')
